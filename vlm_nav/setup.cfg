[metadata]
name = vlm_nav
version = 0.1.0
license = MIT
description = Semantic traversability labels from Vision-Language Models and open-vocabulary segmentation.
author = Takahiro Miki
author_email = takahiro.miki1992@gmail.com
url = https://github.com/leggedrobotics/roam

[options]
packages = find:
package_dir =
    = .
include_package_data = true
zip_safe = true
python_requires = >=3.8
install_requires =
    numpy
    pillow
    torch
    matplotlib
    requests
    ruamel.yaml
    pydantic>=2
    openai>=2
    # Default VLM (gemini-4-hydrogen). google-genai needs Python 3.9+; on 3.8 (ROS Noetic)
    # Gemini goes through its OpenAI-compatible endpoint with the openai package instead.
    google-genai; python_version>="3.9"
    pyastar2d

[options.extras_require]
# Kept for older install commands; google-genai is now installed by default on Python 3.9+.
gemini =
    google-genai
# Only needed to run SAN in-process (segmentation_model="SAN") instead of via the server.
san =
    huggingface_hub
# Monocular depth for click_plan_demo.py (Depth Anything V2).
depth =
    transformers>=4.48

[options.packages.find]
include =
    vlm_nav*
